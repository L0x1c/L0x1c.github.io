  <script>
  (function() {
    const input = document.getElementById('password-input');
    const wall = document.getElementById('password-wall');
    const contentDiv = document.getElementById('decrypted-content');
    const error = document.getElementById('password-error');
    const storageKey = 'post-auth-dy_web_a_bogus';

    
    const encEl = document.getElementById('encrypted-content');
    const encBlob = encEl ? encEl.getAttribute('data-encrypted') : null;

    
    if (!encBlob) return;

    function b64decode(str) {
      const bin = atob(str);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return bytes;
    }

    async function deriveKey(password, salt) {
      const enc = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey(
        'raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']
      );
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: salt, iterations: 100000, hash: 'SHA-256' },
        keyMaterial,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      );
    }

    async function decrypt(password) {
      try {
        const parts = encBlob.split(':');
        if (parts.length !== 4) return null;
        const salt = b64decode(parts[0]);
        const iv = b64decode(parts[1]);
        const tag = b64decode(parts[2]);
        const ciphertext = b64decode(parts[3]);

        const combined = new Uint8Array(ciphertext.length + tag.length);
        combined.set(ciphertext);
        combined.set(tag, ciphertext.length);

        const key = await deriveKey(password, salt);
        const decrypted = await crypto.subtle.decrypt(
          { name: 'AES-GCM', iv: iv },
          key,
          combined
        );
        return new TextDecoder().decode(decrypted);
      } catch (e) {
        return null;
      }
    }

    async function tryUnlock(pwd) {
      const plaintext = await decrypt(pwd);
      if (plaintext !== null) {
        wall.style.display = 'none';
        contentDiv.innerHTML = plaintext;
        contentDiv.style.display = 'block';
        sessionStorage.setItem(storageKey, pwd);
        return true;
      }
      return false;
    }

    
    const cached = sessionStorage.getItem(storageKey);
    if (cached) tryUnlock(cached);

    input.addEventListener('keydown', async function(e) {
      if (e.key === 'Enter') {
        input.disabled = true;
        const ok = await tryUnlock(input.value);
        input.disabled = false;
        if (!ok) {
          error.textContent = 'Access denied.';
          input.value = '';
          input.focus();
          setTimeout(() => { error.textContent = ''; }, 2000);
        }
      }
    });
  })();
  </script>

        function copyingDone() {
            copybutton.innerHTML = 'copied!';
            setTimeout(() => {
                copybutton.innerHTML = 'copy';
            }, 2000);
        }

        copybutton.addEventListener('click', (cb) => {
            if ('clipboard' in navigator) {
